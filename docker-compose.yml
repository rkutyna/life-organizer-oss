# Life Organizer for Mac. From the repo root:
#
#   cp .env.example .env        # then set ORGANIZER_SECRET_KEY (openssl rand -base64 32)
#   docker compose up -d --build
#
# Then open http://localhost:8600 and finish setup. The port is published on this machine's
# loopback only. To reach it from your phone or other computers, put Tailscale, a Cloudflare
# Tunnel or another reverse proxy in front (docs/SETUP.md, docs/CLOUDFLARE.md). Do not publish it
# on 0.0.0.0 unless it is behind HTTPS.
#
# Optional services, each off unless its profile is switched on (`--profile <name>`, or
# COMPOSE_PROFILES=a,b in .env):
#   remote-mcp       organizer-mcp, the claude.ai connector (docs/REMOTE-CONNECTOR.md)
#   remote-mcp-mail  organizer-mcp-mail, mail as a connector of its own
#   cloudflare       cloudflared, a Cloudflare Tunnel run from this project (docs/CLOUDFLARE.md)

services:
  organizer:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    ports:
      - "127.0.0.1:${ORGANIZER_PORT:-8600}:8600"
    environment:
      ORGANIZER_SECRET_KEY: ${ORGANIZER_SECRET_KEY:?set ORGANIZER_SECRET_KEY in .env (openssl rand -base64 32)}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-UTC}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MAIL_WINDOW_DAYS: ${MAIL_WINDOW_DAYS:-30}
    volumes:
      - organizer-data:/app/server/data
    restart: unless-stopped

  # Optional: the MCP tools over streamable HTTP for claude.ai, behind Cloudflare Access
  # (docs/REMOTE-CONNECTOR.md). Off unless started with `--profile remote-mcp` (or
  # COMPOSE_PROFILES=remote-mcp in .env).
  # Its settings come from .env with empty defaults, so the stack starts without them; the
  # container itself refuses to start, naming what is missing, until they are set.
  organizer-mcp:
    profiles: ["remote-mcp"]
    build:
      context: ./mcp
    depends_on:
      - organizer
    ports:
      - "127.0.0.1:${MCP_PORT:-8601}:8601"
    environment:
      ORGANIZER_URL: http://organizer:8600
      # A token with the `api` scope, made in Settings → API tokens with author claude_remote.
      ORGANIZER_TOKEN: ${ORGANIZER_MCP_TOKEN:-}
      MCP_PUBLIC_HOST: ${MCP_PUBLIC_HOST:-}
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      MCP_ALLOWED_EMAIL: ${MCP_ALLOWED_EMAIL:-}
      ORGANIZER_MCP_TOOLSETS: ${ORGANIZER_MCP_TOOLSETS:-all}
      ORGANIZER_MCP_READ_ONLY: ${ORGANIZER_MCP_READ_ONLY:-0}
    restart: unless-stopped

  # Optional: mail as its own claude.ai connector, so mail has its own Access grant and is
  # switched on per chat. Off unless started with `--profile remote-mcp-mail`. The same image,
  # serving only the opt-in `mail` toolset, read-only; those two settings are fixed here, not
  # taken from .env (the server also refuses mail beside any write tool). It alone gets the mail
  # token, and organizer-mcp never does.
  organizer-mcp-mail:
    profiles: ["remote-mcp-mail"]
    build:
      context: ./mcp
    depends_on:
      - organizer
    ports:
      - "127.0.0.1:${MCP_MAIL_PORT:-8602}:8601"
    environment:
      ORGANIZER_URL: http://organizer:8600
      # A token with the `mail` scope, made in Settings → API tokens with author claude_remote.
      ORGANIZER_MAIL_TOKEN: ${ORGANIZER_MCP_MAIL_TOKEN:-}
      MCP_PUBLIC_HOST: ${MCP_MAIL_PUBLIC_HOST:-}
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${MCP_MAIL_CF_ACCESS_AUD:-}
      MCP_ALLOWED_EMAIL: ${MCP_ALLOWED_EMAIL:-}
      ORGANIZER_MCP_TOOLSETS: mail
      ORGANIZER_MCP_READ_ONLY: "1"
    restart: unless-stopped

  # Optional: a remotely managed Cloudflare Tunnel, run as part of this project
  # (docs/CLOUDFLARE.md). Off unless started with `--profile cloudflare`. It needs no inbound
  # port; it dials out to Cloudflare. Its routes are set in the Cloudflare dashboard and reach
  # the services by name on this project's network: http://organizer:8600,
  # http://organizer-mcp:8601, http://organizer-mcp-mail:8601. The token is read from the
  # environment rather than the command line, so it never shows in `ps`.
  cloudflared:
    profiles: ["cloudflare"]
    image: cloudflare/cloudflared:2026.10.7
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - organizer
    restart: unless-stopped

volumes:
  organizer-data:
