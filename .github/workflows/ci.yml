name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Personal data check (generic patterns; the denylist runs locally only)
        run: scripts/scrub-check.sh --tree && scripts/scrub-check.sh --history

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest

  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck && npm run build

  mac-helper:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mac-helper
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build && swift test

  mac-app:
    # The package needs Swift 6.2 (Xcode 26 or later); the app targets macOS 15.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: xcodebuild -version
      - name: Package tests
        run: apple/scripts/test.sh
      - name: Build the app with signing off (no team)
        run: |
          xcodebuild -project apple/LifeOrganizer.xcodeproj -scheme LifeOrganizer \
            -destination 'platform=macOS' -derivedDataPath apple/.build/DerivedData \
            CODE_SIGNING_ALLOWED=NO -quiet build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile -t organizer:ci .
      - run: docker build -t organizer-mcp:ci mcp
